<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      One owner for every SEO tag.

      The title below is the JS-off fallback only. Description, canonical,
      robots, Open Graph and Twitter tags are written per route by
      scripts/prerender.mjs at build time (marked data-rh so react-helmet-async
      adopts them) and then managed by <SEOHead> at runtime. Nothing SEO-related
      is hardcoded here any more: a second, page-wide canonical in this file is
      what used to make every movie page claim to be the homepage.
    -->
    <title>YouMakeTV.ai | Watch and Publish AI-Generated Movies</title>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="msapplication-TileColor" content="#8b5cf6" />

    <!-- Skip-link styling lives here (not an inline handler) so the CSP can
         forbid inline scripts outright. -->
    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        padding: 8px 16px;
        background: #8b5cf6;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        border-radius: 0 0 8px 0;
        transition: top 0.2s;
        z-index: 9999;
      }
      .skip-link:focus {
        top: 0;
      }
    </style>
  </head>
  <body>
    <!-- Skip to main content (accessibility) -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
